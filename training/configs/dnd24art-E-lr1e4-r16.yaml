---
job: extension
config:
  name: "dnd24art-E-lr1e4-r16"
  process:
    - type: 'sd_trainer'
      training_folder: "output"
      performance_log_every: 250
      device: cuda:0
      trigger_word: "dnd24art"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 12
        push_to_hub: false
      datasets:
        - folder_path: "D:/Workbench/LOCAL/LocalAI/lora-corpus-dnd24art/prepared"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512, 768, 1024 ]
      train:
        batch_size: 1
        steps: 4000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.1-dev"
        is_flux: true
        quantize: true
      sample:
        sampler: "flowmatch"
        sample_every: 500
        sample_start_step: 0
        width: 1024
        height: 1024
        prompts:
          - "[trigger] a bone-white male orc fighter with two heavy lower tusks and a dark braided topknot, battered steel plate with dark red straps, waist-up portrait"
          - "[trigger] an elderly male gnome sorcerer in deep green robes with gold embroidery, cupping a wisp of silver-white flame, misty forest"
          - "[trigger] a ruined open-air temple among autumn woods, toppled columns, thick low fog"
          - "[trigger] a male hobgoblin warrior with orange-red skin in a firelit cave, wet rock and stalagmites"
          - "[trigger] a tall blond human paladin in steel plate with a golden sunburst shield"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 20
meta:
  name: "[name]"
  version: '1.0'
